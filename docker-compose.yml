services:
  db:
    image: postgres:17-alpine
    container_name: careerpilot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: careerpilot
      POSTGRES_USER: careerpilot
      POSTGRES_PASSWORD: careerpilot_dev
    ports:
      - "5432:5432"
    volumes:
      - careerpilot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerpilot -d careerpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: careerpilot-api
    environment:
      DATABASE_URL: postgresql+psycopg://careerpilot:careerpilot_dev@db:5432/careerpilot
      ENVIRONMENT: development
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_DAILY_USER_CAP_USD: ${ANTHROPIC_DAILY_USER_CAP_USD:-}
      ANTHROPIC_MONTHLY_CAP_USD: ${ANTHROPIC_MONTHLY_CAP_USD:-}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      JOOBLE_API_KEY: ${JOOBLE_API_KEY:-}
      JOOBLE_API_BASE: ${JOOBLE_API_BASE:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  careerpilot_postgres:
